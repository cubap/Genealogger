<!DOCTYPE html>
<!--
    Death page — M3 vertical slice.
    Runs on the new stack: gl-* custom elements + js/model + an injected store
    adapter (js/adapters). No DEER v1 runtime, no build step, no framework —
    this mirrors birth.html (the M2 reference slice) exactly.
    The deer-key attribute names on the form fields are RETAINED as the
    recognised HTML surface vocabulary; gl-death-form reads them.
    Two legacy controls are gone because neither worked on this page: the
    `grave.html` link (no such page exists in this repo) and the
    `.personDropdown` select (only parents.html ever populated it). The
    "Add Birth" cross-link stays and now carries the real person id.
-->
<html lang="en">
    <head>
        <title>Genealogger - Death</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/site.css" name="genealogger-site-styles">
        <script type="module" src="js/pages/death.js"></script>
    </head>
    <body>
        <a href="./">home</a>

        <div id="personBanner" class="material-banner hidden"></div>

        <div class="material-card">
            <h2>Add Death</h2>
            <gl-death-form id="deathForm" deereventtype="Death">
                <form id="deathDetail" novalidate>
                    <fieldset>
                        <legend>Deceased</legend>
                        <label>Given Name: <input title="First name" type="text" deer-key="givenName" tabindex="1"></label>
                        <label>Family Name (née): <input title="Last name" type="text" deer-key="familyName" tabindex="1"></label>
                        <label>Middle Name(s): <input title="Middle name" type="text" deer-key="additionalName" tabindex="1"></label>
                        <label>Alternate Name(s): <input type="text" deer-key="alternateName" tabindex="1"></label>
                        <label>Place of Death: <input type="text" deer-key="deathPlace" tabindex="1"></label>
                        <label>Confidence for place
                            <select data-confidence-for="deathPlace" title="Confidence for the place assertion">
                                <option value="">(inherit)</option>
                                <option value="certain">Certain</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                                <option value="uncertain">Uncertain</option>
                            </select>
                        </label>
                        <label>Date of Death: <input id="deathDate" type="date" deer-key="deathDate" tabindex="1"></label>
                        <label>Confidence for date
                            <select data-confidence-for="deathDate" title="Confidence for the date assertion">
                                <option value="">(inherit)</option>
                                <option value="certain">Certain</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                                <option value="uncertain">Uncertain</option>
                            </select>
                        </label>
                        <label>Gender:
                            <select deer-key="gender" tabindex="1" title="Select gender">
                                <option value="unspecified/other">unspecified/other</option>
                                <option value="Male">male</option>
                                <option value="Female">female</option>
                            </select>
                        </label>
                    </fieldset>

                    <gl-evidence-picker deerlabel="Evidence document"></gl-evidence-picker>

                    <fieldset>
                        <legend>Participants (witness, attendant, informant, parent)</legend>
                        <p class="hint">Recorded as participants with roles — not witness/attendant blanks on the record.</p>
                        <div data-participants></div>
                        <button type="button" data-add-participant>+ Add participant</button>
                    </fieldset>

                    <input type="submit" value="Record death">
                </form>
            </gl-death-form>
            <a class="person-detail" id="birthLink" href="birth.html?person=">Add Birth</a>
        </div>

        <div class="material-card">
            <h3>Assertions on record</h3>
            <p class="hint">Each assertion shows its evidence document and confidence. Conflicting sources stay separate.</p>
            <div id="existingDeath"></div>
            <div id="existingParticipants"></div>
        </div>
    </body>
</html>
