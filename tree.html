<!DOCTYPE html>
<!--
    Tree page — M3 vertical slice (issue #14 story 10).
    Runs on the new stack: gl-tree-view + js/pages/tree.js + js/model/tree.js +
    an injected store adapter (js/adapters). No DEER v1 runtime, no build
    step, no framework, no visualization library — the SVG is hand-rolled for
    parity; polish is explicitly out of scope for this milestone.

    Edges are DERIVED reads only: nv:hasParent assertions upward (parentsOf)
    and their computed inverse downward (childrenOf). The page never relies on
    a stored nv:hasChild. Contested parentage renders as competing edges plus
    a dashed outline, because the disagreement is the point.

    Deep links: tree.html?person=<id> (the convention the other migrated pages
    use) and the legacy tree.html#<id> emitted by person.html. Optional
    ?generations=N widens the bounded walk; ?store=local|fixture|rerum picks
    the adapter (see docs/devstore-query-contract.md).
-->
<html lang="en">
    <head>
        <title>Genealogger - Tree</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/site.css" name="genealogger-site-styles">
        <script type="module" src="js/pages/tree.js"></script>
    </head>
    <body>
        <a href="./">home</a>

        <div id="personBanner" class="material-banner hidden"></div>

        <div class="material-card">
            <h2>Family tree</h2>
            <p class="hint">
                Click a person to re-root the tree here; the &#8599; link opens their page.
                Each edge names the role and the source Record where the model has one.
                Dashed lines and a &#9888; mark contested parentage: every competing claim
                keeps its own edge instead of one being silently chosen.
            </p>
            <gl-tree-view id="treeView"></gl-tree-view>
        </div>
    </body>
</html>
