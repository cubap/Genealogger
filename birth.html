<!DOCTYPE html>
<!--
    Birth page — M2 vertical slice.
    Runs on the new stack: gl-* custom elements + js/model + an injected store
    adapter (js/adapters). No DEER v1 (js/deer.js), no build step, no framework.
    The deer-key attribute names on the form fields are RETAINED as the
    recognised HTML surface vocabulary; gl-birth-form reads them.
-->
<html lang="en">
    <head>
        <title>Genealogger - Birth</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/site.css" name="genealogger-site-styles">
        <script type="module" src="js/pages/birth.js"></script>
    </head>
    <body>
        <a href="./">home</a>

        <div id="personBanner" class="material-banner hidden"></div>

        <div class="material-card">
            <h2>Add Birth</h2>
            <gl-birth-form id="birthForm" deereventtype="Birth">
                <form id="birthDetail" novalidate>
                    <fieldset>
                        <legend>Child</legend>
                        <label>Given Name: <input title="First name" type="text" deer-key="givenName" tabindex="1"></label>
                        <label>Family Name (née): <input title="Last name" type="text" deer-key="familyName" tabindex="1"></label>
                        <label>Middle Name(s): <input title="Middle name" type="text" deer-key="additionalName" tabindex="1"></label>
                        <label>Alternate Name(s): <input type="text" deer-key="alternateName" tabindex="1"></label>
                        <label>Place of Birth: <input type="text" deer-key="birthPlace" tabindex="1"></label>
                        <label>Confidence for place
                            <select data-confidence-for="birthPlace" title="Confidence for the place assertion">
                                <option value="">(inherit)</option>
                                <option value="certain">Certain</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                                <option value="uncertain">Uncertain</option>
                            </select>
                        </label>
                        <label>Date of Birth: <input type="date" deer-key="birthDate" tabindex="1"></label>
                        <label>Confidence for date
                            <select data-confidence-for="birthDate" title="Confidence for the date assertion">
                                <option value="">(inherit)</option>
                                <option value="certain">Certain</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                                <option value="uncertain">Uncertain</option>
                            </select>
                        </label>
                        <label>Gender:
                            <select deer-key="gender" tabindex="1" title="Select gender">
                                <option value="unspecified/other">unspecified/other</option>
                                <option value="Male">male</option>
                                <option value="Female">female</option>
                            </select>
                        </label>
                    </fieldset>

                    <gl-evidence-picker deerlabel="Evidence document"></gl-evidence-picker>

                    <fieldset>
                        <legend>Participants (mother, father, godparent, informant)</legend>
                        <p class="hint">Recorded as participants with roles — not father/mother blanks.</p>
                        <div data-participants></div>
                        <button type="button" data-add-participant>+ Add participant</button>
                    </fieldset>

                    <input type="submit" value="Record birth">
                </form>
            </gl-birth-form>
        </div>

        <div class="material-card">
            <h3>Assertions on record</h3>
            <p class="hint">Each assertion shows its evidence document and confidence. Conflicting sources stay separate.</p>
            <div id="existingBirth"></div>
            <div id="existingParticipants"></div>
        </div>
    </body>
</html>
