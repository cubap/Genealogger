<!DOCTYPE html>
<!--
    Index (person list) page — M3 slice on the new stack:
    gl-* custom elements + js/model (domain) + an injected store adapter (js/adapters).
    No DEER v1 (js/deer.js), no build step, no framework.

    The list is ONE identity read: js/model/search.js `listPersons()` fetches the
    bare Persons and DERIVES each label from identity data, resolving no
    annotation per row (issue #14 story 1). `gl-person-chip` renders each row and
    `gl-typeahead-filter` routes the query through the model, not through the DOM.
    Store selection is `?store=` (default rerum/devstore; `local`|`memory` for
    deterministic dev & E2E), and the filter survives reloads as `?q=`.
-->
<html lang="en">
    <head>
        <title>Genealogger</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/site.css" name="genealogger-site-styles">
        <script type="module" src="js/pages/index.js"></script>
    </head>
    <body>
        <a href="./">home</a>
        <h1>People</h1>
        <gl-typeahead-filter id="personFilter" placeholder="Filter people by name..."></gl-typeahead-filter>
        <p id="indexStatus" class="hint" data-count="0">Loading people&hellip;</p>
        <div id="peopleList" class="person-list"></div>
        <a href="person.html" class="add-person-btn">New Person</a>
    </body>
</html>
